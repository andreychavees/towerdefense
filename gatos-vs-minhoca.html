<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gatos vs Minhoca</title>
<style>
  html,body{margin:0;height:100%;background:#1d2b1a;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  canvas{height:calc(100% - 70px);max-width:100%;aspect-ratio:360/640;border-radius:10px;background:#7cc24a;touch-action:none}
  button{font-size:16px;font-weight:700;padding:8px 18px;border:0;border-radius:12px;background:#ffb02e;color:#4a2a00;box-shadow:0 4px 0 #b36b00;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #b36b00}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="720" height="1280"></canvas>
  <div style="display:flex;gap:10px"><button id="pause">⏸ Pausar</button><button id="speed">⏩ x1</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),spd=document.getElementById('speed');
const W=360,H=640;

// ---------- Caminho ----------
const GCOLS=8,GROWS=13,TS=45,GX0=0,GY0=44;
const pcx=i=>GX0+TS*(i+.5),pcy=j=>GY0+TS*(j+.5);
// estrada: caverna (1,0) -> desce ate (1,7) -> vai ate (6,7) -> desce ate o portal (6,12)
const PATH=(()=>{
  const pts=[[pcx(1),GY0+TS*0.5]],H2=TS/2;
  const arc=(p0,c,p1)=>{for(let k=1;k<=8;k++){const t=k/8,a=(1-t)*(1-t),b=2*(1-t)*t,d=t*t;pts.push([a*p0[0]+b*c[0]+d*p1[0],a*p0[1]+b*c[1]+d*p1[1]]);}};
  pts.push([pcx(1),pcy(7)-H2]);arc([pcx(1),pcy(7)-H2],[pcx(1),pcy(7)],[pcx(1)+H2,pcy(7)]);
  pts.push([pcx(6)-H2,pcy(7)]);arc([pcx(6)-H2,pcy(7)],[pcx(6),pcy(7)],[pcx(6),pcy(7)+H2]);
  pts.push([pcx(6),pcy(12)]);return pts;})();
const PATH_CELLS=new Map();
(()=>{const T=(i,j,t)=>PATH_CELLS.set(i+','+j,t);
  T(1,0,'cave');for(let j=1;j<=6;j++)T(1,j,'v');T(1,7,'cNE');for(let i=2;i<=5;i++)T(i,7,'h');T(6,7,'cWS');for(let j=8;j<=11;j++)T(6,j,'v');T(6,12,'portal');})();
// decoracao do mapa (i,j,tipo): 0 arvore grande, 1 arvore pequena, 2 arbusto, 3 pedra, 4 tronco, 5 cerca, 6 cerca canto, 7 lago
const DECOR=[[0,0,0],[7,0,0],[3,0,1],[0,4,2],[7,4,1],[5,4,3],[0,9,0],[7,8,7],[7,12,0],[0,12,1],[3,12,2],[4,10,3],[2,12,4],[0,6,5],[7,2,6]];
const BLOCKED=new Set([...PATH_CELLS.keys(),...DECOR.map(d=>d[0]+','+d[1])]);
const segLen=[];let PLEN=0;
for(let i=0;i<PATH.length-1;i++){const l=Math.hypot(PATH[i+1][0]-PATH[i][0],PATH[i+1][1]-PATH[i][1]);segLen.push(l);PLEN+=l;}
function posAt(d){
  if(d<=0)return{x:PATH[0][0],y:PATH[0][1]+d};
  for(let i=0;i<segLen.length;i++){
    if(d<=segLen[i]){const t=d/segLen[i];return{x:PATH[i][0]+(PATH[i+1][0]-PATH[i][0])*t,y:PATH[i][1]+(PATH[i+1][1]-PATH[i][1])*t};}
    d-=segLen[i];
  }
  const p=PATH[PATH.length-1];return{x:p[0],y:p[1]};
}
function nearestOnPath(x,y){
  let best=1e9,bp=null;
  for(let i=0;i<PATH.length-1;i++){
    const [ax,ay]=PATH[i],[bx,by]=PATH[i+1];
    const dx=bx-ax,dy=by-ay;let t=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));
    const px=ax+dx*t,py=ay+dy*t,d=Math.hypot(x-px,y-py);
    if(d<best){best=d;bp={x:px,y:py};}
  }
  return{dist:best,p:bp};
}

// ---------- Estado ----------
const COLORS=['#ffa24a','#f4d03f','#7ed957','#4db8ff','#b46bff','#ff5fa2','#ff4a4a','#ffffff'];
let cats,jars,worm,parts,texts,state,timer,jarTimer,wave,saved,gameSpeed=1,shake=0,drag=null,now=0,idc=0;
const CAT_R=30;

function reset(){
  cats=[];jars=[];worm=null;parts=[];texts=[];state='between';timer=1.5;jarTimer=9;wave=0;saved=0;lives=3;selected=null;
  choice=null;projs=[];addCat(pcx(3),pcy(2),1);addCat(pcx(3),pcy(9),1);
}
function addCat(x,y,lvl){const c={id:++idc,x,y,lvl,ang:Math.random()*6.28,aim:Math.PI/2,cd:0,swing:0,pop:1};cats.push(c);return c;}
function startWave(){
  wave++;
  const et=enemyInfo(wave),armor=Math.floor((wave-1)/4),boss=et.k==='dragon';
  const mult=(1+0.5*armor)*(boss?1.5:1); // armadura e chefe aumentam a vida
  const n=30+wave*4+(boss?12:0),segs=[];
  for(let i=0;i<n;i++){const hp=Math.max(1,Math.round((5+wave*2+(Math.random()<0.25?3:0))*mult));segs.push({hp,max:hp,head:false,flash:0,last:{}});}
  const hh=Math.round((18+wave*14)*mult);segs.unshift({hp:hh,max:hh,head:true,flash:0,last:{}});
  const total=segs.reduce((a,x)=>a+x.hp,0);
  worm={segs,d:-10,speed:Math.min(40,(15+wave*1.2)*(boss?0.85:1)),gap:15,type:et.k,variant:et.variant,name:et.name,armor,boss,total};state='fight';
  texts.push({x:W/2,y:210,s:et.name+(armor?' blindado!':''),life:2.6,big:true});
}
function spawnJar(){
  const hp=8+wave*3+Math.floor(Math.random()*10);
  const lvl=hp>=26?3:hp>=14?2:1; // pote mais forte libera gato de nivel maior
  jars.push({kind:'jar',d:PLEN,hp,lvl,max:hp,flash:0,last:{}});
}
const range=c=>(c.mr||1)*range_(c);
const range_=c=>{let r=62+c.lvl*7;if(c.cls==='mage')r*=1.35;if(c.cls==='knight')r*=0.88;if(c.cls==='archer')r*=1.55;if(c.cls==='bomber')r*=1.2;if(c.cls==='ninja')r*=0.8;if(c.cls==='healer')r*=1.25;if(c.cls==='summoner')r*=1.3;if(c.cls==='angel')r*=1.45;if(c.cls==='wolf')r*=1.25;if(c.cls==='tiger')r*=1.2;return r;};
const melee=c=>Math.min(range(c),56);
const leeks=c=>1+Math.floor(c.lvl/3)+(c.cls==='knight'?1:0)+(c.cls==='ninja'?2:0);
const catDmg=c=>Math.max(1,Math.round(catDmg_(c)*(c.md||1)));
const catDmg_=c=>{let d=c.lvl===1?1:c.lvl*2-1;if(c.cls==='knight')d=Math.round(d*1.7);if(c.cls==='mage')d=Math.round(d*1.1);if(c.cls==='archer')d=Math.max(1,Math.round(d*0.8));if(c.cls==='bomber')d=Math.round(d*2.2);if(c.cls==='ninja')d=Math.round(d*1.2);if(c.cls==='healer')d=Math.max(1,Math.round(d*0.6));if(c.cls==='angel')d=Math.round(d*1.4);if(c.cls==='wolf')d=Math.round(d*1.3);if(c.cls==='tiger')d=Math.round(d*1.2);return d;};
let choice=null,lives=3,selected=null,paused=false;
let projs=[];
const SPACING=44; // distancia minima entre gatos
const JAR_SAFE=90; // distancia inicial (px) em que o pote nao pode ser quebrado

// ---------- Logica ----------
// ponto livre (grama, fora da estrada e sem outro gato) mais proximo de (x,y)
// blocos do chao: cada bloco e uma peca da grade
const TILE_W=TS,TILE_H=TS,TILE_X0=GX0,TILE_Y0=GY0;
function cellAt(x,y){const i=Math.floor((x-TILE_X0)/TILE_W),j=Math.floor((y-TILE_Y0)/TILE_H);return{i,j,x:pcx(i),y:pcy(j)};}
function cellOk(cl,ignore){
  if(cl.i<0||cl.i>=GCOLS||cl.j<0||cl.j>=GROWS)return false;
  if(BLOCKED.has(cl.i+','+cl.j))return false;
  return !cats.some(o=>o!==ignore&&Math.abs(o.x-cl.x)<6&&Math.abs(o.y-cl.y)<6);
}
function validSpot(x,y,ignore){return cellOk(cellAt(x,y),ignore);}
function freeSpot(x,y){
  let best=null,bd=1e9;
  for(let i=0;i<GCOLS;i++)for(let j=0;j<GROWS;j++){const cl={i,j,x:pcx(i),y:pcy(j)};if(!cellOk(cl,null))continue;const d=Math.hypot(cl.x-x,cl.y-y);if(d<bd){bd=d;best=cl;}}
  return best?{x:best.x,y:best.y}:{x:pcx(3),y:pcy(2)};
}
function targetPos(t){
  if(t.kind==='jar')return posAt(t.d);
  const i=worm?worm.segs.indexOf(t):-1;
  return i<0?null:posAt(t.pd!==undefined?t.pd:worm.d-i*worm.gap);
}
function glassBurst(x,y,n){
  const cols=['#bfe6ff','#e8f7ff','#7ec0ee','#ffffff'];
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=60+Math.random()*190;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,life:.7+Math.random()*.5,c:cols[i%4],shard:true,rot:Math.random()*6,vr:(Math.random()-.5)*16,size:3+Math.random()*4});}
}
function dmgObj(o,dmg,p){
  if(o.kind==='jar')glassBurst(p.x,p.y-4,3);
  else for(let q=0;q<3;q++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170-30,life:.3,c:Math.random()<.5?'#ffffff':'#ffe066'});
o.hp-=dmg;o.flash=0.12;texts.push({x:p.x+(Math.random()*12-6),y:p.y-14,s:'-'+dmg,life:0.5});}
function burst(x,y,n,cols=['#8b8378','#c8bfae']){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*100;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.5+Math.random()*0.4,c:cols[i%cols.length]});}}

const RANGED={
  mage:{rate:l=>Math.max(.35,.75-.05*l),speed:300,splash:40,sp:.5,label:'Bola de fogo (área)'},
  archer:{rate:l=>Math.max(.22,.5-.04*l),speed:560,splash:0,sp:0,label:'Flechas (crítico 20%)'},
  bomber:{rate:l=>Math.max(.9,1.6-.06*l),speed:210,splash:62,sp:.6,label:'Bomba (área grande)'},
  healer:{rate:l=>Math.max(.45,.9-.05*l),speed:320,splash:30,sp:.5,label:'Orbe sagrado (cura vidas)'},
  summoner:{rate:l=>Math.max(.5,1.0-.05*l),speed:260,splash:55,sp:.6,label:'Esfera venenosa (área)'},
  angel:{rate:l=>Math.max(.2,.45-.03*l),speed:520,splash:0,sp:0,label:'Raio sagrado'},
  wolf:{rate:l=>Math.max(.3,.65-.04*l),speed:620,splash:60,sp:.7,label:'Raio em cadeia (área)'},
  tiger:{rate:l=>Math.max(.35,.7-.04*l),speed:330,splash:50,sp:.6,label:'Fogo + queimadura (área)'}
};
const PTR={mage:['#ff9a2a','#ffd23a'],healer:['#ffe066','#ffffff'],summoner:['#9bff5a','#3fae20'],angel:['#ffffff','#bfdcff'],wolf:['#ffffff','#7fb4ff'],tiger:['#ff9a2a','#ffe066']};
const PCOL={mage:['255,250,200','255,170,40','255,60,20'],healer:['255,255,230','255,224,102','255,170,40'],summoner:['230,255,200','150,240,80','40,140,30'],angel:['255,255,255','200,230,255','120,160,255'],wolf:['255,255,255','120,190,255','40,90,255'],tiger:['255,240,180','255,140,30','230,50,10']};
let healHits=0;
// armadura do inimigo: reduz dano fisico (espada/flecha), bomba perfura
function armorDmg(t,d,k){
  if(!worm||t.kind==='jar'||!worm.armor)return d;
  if(k==='knight'||k==='archer')return Math.max(1,Math.round(d*(1-0.15*worm.armor)));
  if(k==='bomber')return Math.round(d*(1+0.25*worm.armor));
  return d;
}
function mageUpdate(c,dt){
  const P=RANGED[c.cls];
  c.cd-=dt;c.cast=Math.max(0,(c.cast||0)-dt*5);
  const R=range(c);let tgt=null;
  if(worm)for(const t of worm.segs){if(t.hp<=0)continue;const p=targetPos(t);if(!p||p.y<GY0+14)continue;if(Math.hypot(p.x-c.x,p.y-c.y)<=R){tgt=t;break;}}
  if(!tgt)for(const j of jars){if(j.hp<=0||j.d>PLEN-JAR_SAFE)continue;const p=targetPos(j);if(p&&Math.hypot(p.x-c.x,p.y-c.y)<=R){tgt=j;break;}}
  if(!tgt)return;
  const tp=targetPos(tgt);c.aim=Math.atan2(tp.y-c.y,tp.x-c.x);
  if(c.cd<=0){c.cd=P.rate(c.lvl);c.cast=1;
    let dmg=catDmg(c),crit=false;if(c.cls==='archer'&&Math.random()<0.2){dmg*=2;crit=true;}
    projs.push({x:c.x+Math.cos(c.aim)*26,y:c.y+Math.sin(c.aim)*26,t:tgt,k:c.cls,dmg,crit,rot:c.aim,big:c.lvl>=7});}
}
function updateProjs(dt){
  for(const p of projs){
    const P=RANGED[p.k];
    const tp=p.t.hp>0?targetPos(p.t):null;
    if(!tp){p.dead=true;continue;}
    const dx=tp.x-p.x,dy=tp.y-p.y,dd=Math.hypot(dx,dy),sp=P.speed*dt;
    p.rot=Math.atan2(dy,dx);
    if(p.k!=='archer')parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.25,c:(PTR[p.k]||['#8a8f9a','#8a8f9a'])[Math.random()<.5?0:1]});
    if(dd<=sp+8){
      const real=armorDmg(p.t,p.dmg,p.k);
      dmgObj(p.t,real,tp);if(p.crit)texts.push({x:tp.x,y:tp.y-28,s:'CRÍTICO!',life:.6});
      if(p.t.hp<=0&&p.t.head)shake=6;
      if(p.k==='tiger')p.t.burn=3;
      if((p.k==='mage'||p.k==='summoner')&&worm&&p.t.kind!=='jar')worm.slow=p.k==='summoner'?1.3:0.8;
      if(p.k==='healer'){healHits++;if(healHits>=30){healHits=0;if(lives<3){lives++;texts.push({x:W/2,y:280,s:'+1 vida!',life:2,big:true});}}}
      if(P.splash){
        const rad=P.splash*(p.big?1.3:1),sp2=Math.max(1,Math.ceil(p.dmg*P.sp)),cand=jars.slice();if(worm)cand.push(...worm.segs);
        for(const t of cand){if(t===p.t||t.hp<=0||(t.kind==='jar'&&t.d>PLEN-JAR_SAFE))continue;const q=targetPos(t);if(q&&Math.hypot(q.x-tp.x,q.y-tp.y)<rad){dmgObj(t,armorDmg(t,sp2,p.k),q);if(p.k==='tiger')t.burn=3;if(p.k==='wolf')parts.push({bolt:true,x:tp.x,y:tp.y,x2:q.x,y2:q.y,life:.2});}}
        burst(tp.x,tp.y,p.k==='bomber'?22:14,p.k==='bomber'?['#444','#ff7a1a','#ffd23a','#888']:(PTR[p.k]||['#ff7a1a','#ffd23a','#ff4a1a']));
        if(p.k==='bomber')shake=Math.max(shake,3);
      }else burst(tp.x,tp.y,5,['#e8d9a8','#fff']);
      p.dead=true;
    }else{p.x+=dx/dd*sp;p.y+=dy/dd*sp;}
  }
  projs=projs.filter(p=>!p.dead);
}
function update(dt){
  now+=dt;
  if(choice||paused)return; // pausado (escolha de classe ou botao)
  {const bl=worm?jars.concat(worm.segs):jars;for(const t of bl){if(t.burn>0&&t.hp>0){t.burn-=dt;t.bt=(t.bt||0)+dt;if(t.bt>=0.5){t.bt=0;const bp=targetPos(t);if(bp){dmgObj(t,1,bp);parts.push({x:bp.x+(Math.random()-.5)*10,y:bp.y-6,vx:(Math.random()-.5)*30,vy:-70,life:.4,c:Math.random()<.5?'#ff9a2a':'#ffd23a'});}}}}}
  if(state==='over')return;
  if(state==='between'){timer-=dt;if(timer<=0)startWave();}
  jarTimer-=dt;if(jarTimer<=0){if(jars.length<2)spawnJar();jarTimer=16;}
  if(worm){worm.d+=worm.speed*(worm.slow>0?0.5:1)*dt;worm.slow=(worm.slow||0)-dt;if(worm.back>0){const st_=Math.min(worm.back,170*dt);worm.d=Math.max(-10,worm.d-st_);worm.back-=st_;}{const cs=420*dt;worm.segs.forEach((sg,i)=>{const tg=worm.d-i*worm.gap;if(sg.pd===undefined)sg.pd=tg;else sg.pd+=Math.max(-cs,Math.min(cs,tg-sg.pd));});}if(worm.d>PLEN+10){lives--;shake=12;texts.push({x:W/2,y:300,s:'Vida perdida!',life:2,big:true});worm=null;state=lives<=0?'over':'between';timer=4;}}
  for(const j of jars){j.d-=22*dt;if(j.flash>0)j.flash-=dt;}
  jars=jars.filter(j=>j.d>-30);
  for(const c of cats){
    c.pop=Math.max(0,c.pop-dt*4);c.atk=Math.max(0,(c.atk||0)-dt);
    if(drag&&drag.cat===c)continue;
    // alho-poro girando em volta do gato: da dano em tudo que encostar, ate o limite do alcance
    c.ang+=dt*(6+c.lvl*0.4)*(c.cls==='ninja'?1.7:1);
    if(RANGED[c.cls]){mageUpdate(c,dt);continue;}
    const n=leeks(c),R=melee(c);
    const cand=jars.slice();if(worm)cand.push(...worm.segs);
    for(const t of cand){
      if(t.hp<=0||(t.kind==='jar'&&t.d>PLEN-JAR_SAFE))continue; // pote protegido no inicio do trajeto
      const p=targetPos(t);if(!p||p.y<GY0+14)continue;
      const tr=t.kind==='jar'?17:(t.head?25:18);
      if(Math.hypot(p.x-c.x,p.y-c.y)>R+tr+8)continue;
      for(let k=0;k<n;k++){
        const a=c.ang+k*6.2832/n;let hit=false;
        for(let f=0.35;f<=1.001;f+=0.13){if(Math.hypot(c.x+Math.cos(a)*R*f-p.x,c.y+Math.sin(a)*R*f-p.y)<tr+7){hit=true;break;}}
        const key=c.id+'_'+k;
        if(hit&&now-(t.last[key]||-9)>0.3){t.last[key]=now;if(c.cls==='knight')c.atk=0.5;dmgObj(t,c.cls==='knight'?armorDmg(t,catDmg(c),'knight'):catDmg(c),p);if(t.hp<=0&&t.head)shake=6;}
      }
    }
  }
  updateProjs(dt);
  // potes quebrados => gato entra no time
  for(const j of jars){
    if(j.hp<=0){const p=posAt(j.d);glassBurst(p.x,p.y,30);burst(p.x,p.y,10,['#9fdcff','#e8f7ff']);parts.push({x:p.x,y:p.y,ring:true,r:6,vr:190,life:.4,c:'#cfeeff'});parts.push({x:p.x,y:p.y,ring:true,r:2,vr:90,life:.3,c:'#ffffff'});shake=Math.max(shake,3);const fs=freeSpot(p.x,p.y);addCat(fs.x,fs.y,j.lvl);saved++;
      texts.push({x:p.x,y:p.y-30,s:'Novo gato!',life:1.2,big:true});j.dead=true;}
  }
  jars=jars.filter(j=>!j.dead);
  if(worm){
    if(worm.segs[0].hp<=0){
      worm.segs.forEach((sg,i)=>{const p=posAt(sg.pd!==undefined?sg.pd:worm.d-i*worm.gap);burst(p.x,p.y,sg.head?18:8);});
      texts.push({x:W/2,y:250,s:'Onda '+wave+' vencida!',life:2,big:true});
      worm=null;state='between';timer=4;
    }else{
      worm.segs.forEach((sg,i)=>{if(sg.hp<=0&&!sg.head){const p=posAt(sg.pd!==undefined?sg.pd:worm.d-i*worm.gap);burst(p.x,p.y,8);parts.push({x:p.x,y:p.y,ring:true,r:4,vr:110,life:.25,c:'#ffffff'});}});
      {const nd=worm.segs.filter(sg=>sg.hp<=0&&!sg.head).length;if(nd)worm.back=(worm.back||0)+nd*worm.gap*0.35;}
      worm.segs=worm.segs.filter(sg=>sg.hp>0||sg.head);
    }
  }
  parts.forEach(p=>{if(p.bolt){p.life-=dt;return;}if(p.ring){p.r+=p.vr*dt;p.life-=dt;return;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;if(p.shard)p.rot+=p.vr*dt;});parts=parts.filter(p=>p.life>0);
  texts.forEach(t=>{t.y-=20*dt;t.life-=dt;});texts=texts.filter(t=>t.life>0);
  shake=Math.max(0,shake-dt*20);
}

// ---------- Entrada ----------

    return;}return;}
  if(state==='over'){reset();return;}

  if(c){drag={cat:c,x:p.x,y:p.y,sx:p.x,sy:p.y};cv.setPointerCapture(e.pointerId);}else selected=null;
});

  if(!drag)return;

  }else if(type==='snake'){
    ctx.fillStyle=bodyGrad(r,'#b4f27a','#4fae35','#1d5a1d');ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();ctx.stroke();
    ctx.save();ctx.beginPath();ctx.arc(0,0,r-1.5,0,6.28);ctx.clip();ctx.rotate(ang);
    ctx.fillStyle='rgba(15,70,20,.55)';
    ctx.beginPath();ctx.moveTo(-r*.7,0);ctx.lineTo(0,-r*.7);ctx.lineTo(r*.7,0);ctx.lineTo(0,r*.7);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,240,140,.75)';ctx.beginPath();ctx.moveTo(-r*.3,0);ctx.lineTo(0,-r*.3);ctx.lineTo(r*.3,0);ctx.lineTo(0,r*.3);ctx.closePath();ctx.fill();
    ctx.restore();
    if(head){
      const tg=Math.sin(now*14)*3; // lingua
      ctx.strokeStyle='#e0245e';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,r-6);ctx.lineTo(tg,r+8);ctx.moveTo(tg,r+8);ctx.lineTo(tg-4,r+13);ctx.moveTo(tg,r+8);ctx.lineTo(tg+4,r+13);ctx.stroke();
      for(const sx of[-1,1]){ctx.fillStyle='#ffe94a';ctx.strokeStyle='#143d14';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(sx*9,-5,5.5,6.5,0,0,6.28);ctx.fill();ctx.stroke();
        ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(sx*9,-4,1.6,5,0,0,6.28);ctx.fill();
        ctx.strokeStyle='#143d14';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx*15,-12);ctx.lineTo(sx*4,-8);ctx.stroke();}
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-8,9);ctx.lineTo(-5,9);ctx.lineTo(-6.5,16);ctx.fill();ctx.beginPath();ctx.moveTo(8,9);ctx.lineTo(5,9);ctx.lineTo(6.5,16);ctx.fill();
      ctx.fillStyle='#143d14';ctx.beginPath();ctx.arc(-3,3,1.2,0,6.28);ctx.arc(3,3,1.2,0,6.28);ctx.fill();
    }
  }else if(type==='centipede'){
    ctx.save();ctx.rotate(ang);ctx.strokeStyle='#4a2208';ctx.lineWidth=3;ctx.lineCap='round';
    const w=Math.sin(now*12+i)*3;ctx.beginPath();ctx.moveTo(w,-r-9);ctx.lineTo(0,-r+3);ctx.moveTo(-w,r+9);ctx.lineTo(0,r-3);ctx.stroke();ctx.restore();
    ctx.strokeStyle=OL;ctx.lineWidth=3;
    ctx.fillStyle=bodyGrad(r,'#ffc25e','#e0702a','#8a3410');ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();ctx.stroke();
    ctx.save();ctx.beginPath();ctx.arc(0,0,r-1.5,0,6.28);ctx.clip();ctx.rotate(ang);
    ctx.fillStyle='rgba(90,30,5,.55)';ctx.fillRect(-4,-r,5,r*2);ctx.fillStyle='rgba(255,230,160,.5)';ctx.fillRect(-9,-r,2,r*2);ctx.restore();
    if(head){
      ctx.strokeStyle='#4a2208';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-6,-r+4);ctx.quadraticCurveTo(-16,-r-6,-10,-r-14);ctx.moveTo(6,-r+4);ctx.quadraticCurveTo(16,-r-6,10,-r-14);ctx.stroke();
      for(const sx of[-1,1]){ctx.fillStyle='#fff';ctx.strokeStyle='#4a2208';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx*8,-4,5.5,0,6.28);ctx.fill();ctx.stroke();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx*8,-3,2.6,0,6.28);ctx.fill();}
      ctx.fillStyle='#c0201e';ctx.strokeStyle='#4a2208';ctx.lineWidth=2;
      for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(sx*4,8);ctx.quadraticCurveTo(sx*16,10,sx*9,22);ctx.quadraticCurveTo(sx*8,14,sx*2,12);ctx.closePath();ctx.fill();ctx.stroke();}
    }
  }else if(head){if(!drawDragonSprite(r,worm&&worm.variant,worm&&worm.armor))drawDragonHead(r,DRAGON_PAL[(worm&&worm.variant)||'fire']);
  }else{ // dragao
    ctx.fillStyle=pal.crest0;ctx.strokeStyle=pal.ol;ctx.lineWidth=2;
    if(!head){spike(0,-r+1,-Math.PI/2+0.2,9,4);spike(0,r-1,Math.PI/2-0.2,9,4);}
    ctx.strokeStyle='#3a0808';ctx.lineWidth=3;
    ctx.fillStyle=bodyGrad(r,pal.b0,pal.b1,pal.b2);ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();ctx.stroke();
    ctx.save();ctx.beginPath();ctx.arc(0,0,r-1.5,0,6.28);ctx.clip();
    ctx.strokeStyle='rgba(60,5,5,.45)';ctx.lineWidth=1.5;for(let row=-2;row<=2;row++)for(let col=-2;col<=2;col++){ctx.beginPath();ctx.arc(col*9+(row%2?4.5:0),row*8,5,0.2,3);ctx.stroke();}
    ctx.fillStyle=pal.belly;ctx.beginPath();ctx.ellipse(0,r*.45,r*.7,r*.45,0,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.ellipse(-7,-10,10,4,-.5,0,6.28);ctx.fill();ctx.restore();
    if(head){
      ctx.fillStyle='#f4e6c0';ctx.strokeStyle='#3a0808';ctx.lineWidth=2;
      for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(sx*10,-r+6);ctx.quadraticCurveTo(sx*24,-r-2,sx*20,-r-16);ctx.quadraticCurveTo(sx*14,-r-4,sx*5,-r+3);ctx.closePath();ctx.fill();ctx.stroke();}
      for(const sx of[-1,1]){ctx.fillStyle='#ffd23a';ctx.strokeStyle='#3a0808';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(sx*10,-6,6,6,0,0,6.28);ctx.fill();ctx.stroke();
        ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(sx*10,-5.5,1.8,5,0,0,6.28);ctx.fill();
        ctx.strokeStyle='#3a0808';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx*17,-14);ctx.lineTo(sx*4,-9);ctx.stroke();}
      ctx.fillStyle='#4a0a0a';ctx.beginPath();ctx.arc(-3,4,1.6,0,6.28);ctx.arc(3,4,1.6,0,6.28);ctx.fill();
      ctx.fillStyle='#2a0505';ctx.strokeStyle='#3a0808';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,14,12,7,0,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*4.5-2,9);ctx.lineTo(k*4.5+2,9);ctx.lineTo(k*4.5,14);ctx.fill();}
      const f=Math.sin(now*18)*2; // chamas
      ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.moveTo(-8,r-4);ctx.quadraticCurveTo(-10+f,r+12,0,r+16+f);ctx.quadraticCurveTo(10-f,r+12,8,r-4);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.moveTo(-4,r-2);ctx.quadraticCurveTo(-4,r+8,0,r+11);ctx.quadraticCurveTo(4,r+8,4,r-2);ctx.closePath();ctx.fill();
    }
  }
  // armadura (aumenta a resistencia)
  if(armor>0&&!(type==='dragon'&&head&&dragonReady>=20)&&!(type==='worm'&&head&&WORM_HEAD)){
    const mc=ARMOR_COL[Math.min(armor,3)];
    ctx.strokeStyle=mc;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r-2,0,6.28);ctx.stroke();
    ctx.strokeStyle='rgba(30,30,40,.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,r-4.2,0,6.28);ctx.stroke();
    ctx.fillStyle='#4a4f5c';for(let a=0;a<4;a++){const an=a*1.571+.7;ctx.beginPath();ctx.arc(Math.cos(an)*(r-2),Math.sin(an)*(r-2),1.8,0,6.28);ctx.fill();}
    if(armor>=2&&!head){ctx.fillStyle=mc;ctx.strokeStyle='#2b2f3a';ctx.lineWidth=1.5;for(let a=0;a<3;a++){const an=a*2.09+1.1+ang*0;spike(Math.cos(an)*(r-1),Math.sin(an)*(r-1),an,6,3);}}
    if(head){ // elmo
      const gg=ctx.createLinearGradient(0,-r,0,0);gg.addColorStop(0,'#fff');gg.addColorStop(1,mc);
      ctx.fillStyle=gg;ctx.strokeStyle='#2b2f3a';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,-r*.22,r*.98,r*.72,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.strokeStyle='#2b2f3a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-r*.94);ctx.lineTo(0,-r*.22);ctx.stroke();
      if(armor>=2){ctx.fillStyle=mc;spike(-r*.6,-r*.62,-2.2,9,3.5);spike(r*.6,-r*.62,-0.94,9,3.5);}
      if(armor>=3){ctx.fillStyle='#e03a3a';ctx.beginPath();ctx.moveTo(-3,-r*.94);ctx.quadraticCurveTo(0,-r-16,10,-r-8);ctx.quadraticCurveTo(5,-r-4,4,-r*.94);ctx.closePath();ctx.fill();ctx.stroke();}
    }
  }
  if(sg.flash>0&&!(type==='dragon'&&head)&&!(type==='worm'&&head&&WORM_HEAD)){ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();}
}
function drawWorm(){
  if(!worm)return;
  const type=worm.type,boss=worm.boss;
  for(let i=worm.segs.length-1;i>=0;i--){
    const sg=worm.segs[i],d=sg.pd!==undefined?sg.pd:worm.d-i*worm.gap,p=posAt(d);
    if(p.y<GY0+TS*0.3)continue;
    const r=sg.head?(boss?30:26):(type==='snake'?18:boss?21:20);
    ctx.save();ctx.translate(p.x,p.y);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(3,r*.75,r,r*.45,0,0,6.28);ctx.fill();
    drawSeg(type,sg,r,i,angAt(d),worm.armor);
    ctx.restore();
    ctx.textAlign='center';
    if(sg.head){ctx.font='900 22px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.fillStyle='#e01b1b';ctx.strokeText(sg.hp,p.x,p.y-r-(type==='dragon'?30:6));ctx.fillText(sg.hp,p.x,p.y-r-(type==='dragon'?30:6));}
    else{ctx.font='900 11px system-ui';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.fillStyle='#fff';ctx.strokeText(sg.hp,p.x,p.y-r*.42);ctx.fillText(sg.hp,p.x,p.y-r*.42);}
    
    if(sg.flash>0)sg.flash-=0.016;
  }
}

// ---------- HUD ----------
function heart(x,y,s,on){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=on?'#ff4d6a':'#4a5160';ctx.strokeStyle=on?'#7a1226':'#2a2f3a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,6);ctx.bezierCurveTo(-12,-2,-7,-11,0,-5);ctx.bezierCurveTo(7,-11,12,-2,0,6);ctx.closePath();ctx.fill();ctx.stroke();
  if(on){ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(-4,-4,2,1.2,-0.6,0,6.28);ctx.fill();}
  ctx.restore();
}
function bar(x,y,w,h,f,c0,c1){
  ctx.fillStyle='rgba(0,0,0,.55)';rr(ctx,x,y,w,h,h/2);ctx.fill();
  f=Math.max(0,Math.min(1,f));if(f>0){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;rr(ctx,x+1,y+1,Math.max(h-2,(w-2)*f),h-2,(h-2)/2);ctx.fill();}
}
function shadowText(t,x,y,font,fill,align='left'){ctx.font=font;ctx.textAlign=align;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y);}
function pill(x,y,w,h,c0,c1){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;rr(ctx,x,y,w,h,h/2);ctx.fill();ctx.stroke();}
function drawHUD(){
  pill(8,7,62,22,'#5a6aa8','#313c70');
  for(let i=0;i<3;i++)heart(22+i*18,18,.78,i<lives);
  let title,sub,frac,c0,c1;
  if(worm){title='ONDA '+wave;sub=worm.name+(worm.armor>0?' · '+ARMOR_NAMES[Math.min(worm.armor,3)].replace('Armadura de ','').replace('Armadura ',''):'');
    const hp=worm.segs.reduce((a,s_)=>a+Math.max(0,s_.hp),0);frac=hp/worm.total;c0='#ff8a6a';c1='#e03a2a';}
  else{title='ONDA '+(wave+1);const nx=enemyInfo(wave+1);sub='Próxima: '+nx.name;frac=1-timer/4;c0='#7ad0ff';c1='#2a7ad0';}
  pill(W/2-46,7,92,22,worm&&worm.boss?'#ff5a6a':'#ffbf3a',worm&&worm.boss?'#c4223a':'#f07a0a');
  shadowText(title,W/2,23,'900 12px system-ui','#fff','center');
  bar(W/2-42,32,84,6,frac,c0,c1);
  shadowText(sub,W/2,49,'bold 10px system-ui','#fff','center');
  pill(W-98,7,44,22,'#52bb68','#2a8044');shadowText('🐱 '+cats.length,W-76,23,'bold 11px system-ui','#fff','center');
  pill(W-50,7,42,22,'#4aa6ea','#2a6cb0');shadowText('🫙 '+saved,W-29,23,'bold 11px system-ui','#fff','center');
  if(jars.length<2){pill(8,H-28,92,20,'#4a86c8','#2a5694');shadowText('🫙',22,H-13,'bold 11px system-ui','#fff','center');bar(34,H-22,60,7,1-jarTimer/16,'#bfe8ff','#5ab0f0');}
  if(selected&&cats.includes(selected)){
    const c=selected;
    ctx.strokeStyle='#ffe066';ctx.lineWidth=2.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(c.x,c.y,26,0,6.28);ctx.stroke();ctx.setLineDash([]);
    const y0=H-92;
    ctx.fillStyle='rgba(20,26,44,.92)';ctx.strokeStyle=tierCol(c);ctx.lineWidth=2.5;rr(ctx,10,y0,W-20,56,14);ctx.fill();ctx.stroke();
    ctx.save();ctx.translate(40,y0+38);ctx.scale(.95,.95);drawCat({id:c.id,lvl:c.lvl,cls:c.cls,ang:0,pop:0},0,0,false,true);ctx.restore();
    shadowText(catName(c)+' · Nível '+c.lvl,72,y0+21,'900 14px system-ui','#fff');
    shadowText('Dano '+catDmg(c)+'  ·  Alcance '+Math.round(RANGED[c.cls]?range(c):melee(c))+'  ·  '+WEAPON_NAME[weaponStyle(c)],72,y0+40,'11px system-ui','#ffe9b0');
  }
  if(paused){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);shadowText('PAUSADO',W/2,H/2,'900 30px system-ui','#fff','center');}
}


function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG();
  jars.forEach(drawJar);
  drawWorm();
  if(CAVE_TILE){ctx.save();ctx.beginPath();ctx.rect(pcx(1)-TS/2,GY0,TS,TS*0.5);ctx.clip();ctx.drawImage(CAVE_TILE,pcx(1)-TS/2,GY0,TS,TS);ctx.restore();}
  for(const c of cats)if(!(drag&&drag.cat===c))drawCat(c,c.x,c.y,false);
  if(drag){
    const cl=cellAt(drag.x,drag.y);
    for(let i=0;i<=7;i++)for(let j=0;j<=12;j++){const q={i,j,x:TILE_X0+TILE_W*(i+.5),y:TILE_Y0+TILE_H*(j+.5)};if(!cellOk(q,drag.cat))continue;
      ctx.fillStyle='rgba(255,255,255,.14)';rr(ctx,q.x-TILE_W/2+2,q.y-TILE_H/2+2,TILE_W-4,TILE_H-4,6);ctx.fill();}
    const c=drag.cat,o=cats.find(k=>k!==c&&Math.abs(k.x-cl.x)<6&&Math.abs(k.y-cl.y)<6);
    if(o){ctx.strokeStyle=o.lvl===c.lvl?'#6dff6d':'#ff6d6d';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(o.x,o.y,26,0,6.28);ctx.stroke();ctx.setLineDash([]);}
    const ok=!!o?(o.lvl===c.lvl&&(o.cls||null)===(c.cls||null)):cellOk(cl,c);
    ctx.fillStyle=ok?'rgba(255,255,255,.2)':'rgba(255,60,60,.25)';ctx.strokeStyle=ok?'#fff':'#ff5a5a';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cl.x,cl.y,RANGED[c.cls]?range(c):melee(c),0,6.28);ctx.fill();ctx.stroke();
    ctx.strokeStyle=ok?'#6dff6d':'#ff5a5a';ctx.lineWidth=3;rr(ctx,cl.x-TILE_W/2+2,cl.y-TILE_H/2+2,TILE_W-4,TILE_H-4,7);ctx.stroke();
    drawCat(c,drag.x,drag.y,true);
  }
  for(const p of projs){
    if(p.k==='archer'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.strokeStyle='#3a2614';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(8,0);ctx.stroke();
      ctx.strokeStyle='#d9b57a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(8,0);ctx.stroke();
      ctx.fillStyle=p.crit?'#ffd23a':'#cfd6e0';ctx.strokeStyle='#3a2614';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(6,-4);ctx.lineTo(6,4);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#e8404f';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-19,-4);ctx.lineTo(-10,-1);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-19,4);ctx.lineTo(-10,1);ctx.closePath();ctx.fill();
      ctx.restore();
    }else if(p.k==='bomber'){
      ctx.fillStyle='#22262e';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(p.x-3,p.y-3,2.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#d9b57a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+3,p.y-8);ctx.lineTo(p.x+7,p.y-13);ctx.stroke();
      ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.arc(p.x+7+Math.sin(now*40),p.y-13,2.6,0,6.28);ctx.fill();
    }else{
      const r=(p.big?11:8)+Math.sin(now*30)*1.2;
      const PC=PCOL[p.k]||PCOL.mage,g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,r*2.1);g.addColorStop(0,'rgba('+PC[0]+',1)');g.addColorStop(.35,'rgba('+PC[1]+',.95)');g.addColorStop(1,'rgba('+PC[2]+',0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*2.1,0,6.28);ctx.fill();
      ctx.fillStyle='#fff4b0';ctx.beginPath();ctx.arc(p.x,p.y,r*.55,0,6.28);ctx.fill();
    }
  }
  parts.forEach(p=>{
    if(p.bolt){ctx.globalAlpha=Math.min(1,p.life*6);ctx.lineCap='round';ctx.lineJoin='round';
      const dx=p.x2-p.x,dy=p.y2-p.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,pts=[[p.x,p.y]];
      for(let k=1;k<4;k++){const o=(((k*37+Math.floor(p.life*40))%7)-3)*3;pts.push([p.x+dx*k/4+nx*o,p.y+dy*k/4+ny*o]);}pts.push([p.x2,p.y2]);
      ctx.strokeStyle='#4a90ff';ctx.lineWidth=5;ctx.beginPath();pts.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.8;ctx.stroke();return;}
    if(p.ring){ctx.globalAlpha=Math.max(0,p.life*2.2);ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.stroke();return;}
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.fillStyle=p.c;
    if(p.shard){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.8,p.size*.7);ctx.lineTo(-p.size*.7,p.size*.5);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(40,90,140,.7)';ctx.lineWidth=1;ctx.stroke();ctx.restore();}
    else ctx.fillRect(p.x-3,p.y-3,6,6);
  });ctx.globalAlpha=1;
  texts.forEach(t=>{ctx.globalAlpha=Math.min(1,t.life*2);ctx.font=t.big?'bold 18px system-ui':'bold 13px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.fillStyle='#ffe066';ctx.strokeText(t.s,t.x,t.y);ctx.fillText(t.s,t.x,t.y);});ctx.globalAlpha=1;
  drawHUD();
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText('Fim de jogo',W/2,260);
    ctx.font='18px system-ui';ctx.fillText('Você chegou à onda '+wave,W/2,296);ctx.fillText('Toque para recomeçar',W/2,330);
  }
  ctx.restore();
}

let last=performance.now();
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;ctx.setTransform(2,0,0,2,0,0);
  for(let i=0;i<gameSpeed;i++)update(dt);
  draw();if(choice)drawChoice();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
