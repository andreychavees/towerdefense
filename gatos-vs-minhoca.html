<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gatos vs Minhoca</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#1d2b1a;font-family:system-ui,sans-serif;overflow:hidden}
  #wrap{box-sizing:border-box;width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  canvas{display:block;flex:none;width:var(--board-width, min(100%,360px));height:auto;aspect-ratio:360/640;border-radius:10px;background:#7cc24a;touch-action:none}

  button{box-sizing:border-box;min-height:44px;min-width:128px;display:flex;align-items:center;justify-content:center;gap:9px;padding:9px 18px;border:0;background:var(--control-art,linear-gradient(#755329,#44311e)) center/100% 100% no-repeat;color:#fff0bf;font:800 12px "Trebuchet MS",system-ui,sans-serif;letter-spacing:1px;cursor:pointer;filter:drop-shadow(0 3px 2px #0d180d80)}

<body>
<div id="loading" role="status" aria-live="polite">Preparando a floresta e os heróis…</div>
<div id="wrap">
  <canvas id="c" width="720" height="1280"></canvas>
  <div id="controls"><button id="pause" type="button" aria-pressed="false"><img alt=""><span>PAUSAR</span></button><button id="speed" type="button" aria-label="Velocidade 1 vez"><img alt=""><span>RITMO ×1</span></button></div>
</div>
<script src="motion.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),spd=document.getElementById('speed');
const W=360,H=640;
// Fit the complete board and controls inside the available viewport.
function fitBoard(){
  const wrap=document.getElementById('wrap'),controls=document.getElementById('controls');
  const style=getComputedStyle(wrap);
  const width=wrap.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
  const height=wrap.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-controls.getBoundingClientRect().height-parseFloat(style.gap);
  cv.style.setProperty('--board-width',Math.max(1,Math.min(width,height*W/H))+'px');
}
new ResizeObserver(fitBoard).observe(document.getElementById('wrap'));
new ResizeObserver(fitBoard).observe(document.getElementById('controls'));
fitBoard();

// ---------- Caminho ----------
const GCOLS=8,GROWS=13,TS=45,GX0=0,GY0=44;
const pcx=i=>GX0+TS*(i+.5),pcy=j=>GY0+TS*(j+.5);
// estrada: caverna (1,0) -> desce ate (1,7) -> vai ate (6,7) -> desce ate o portal (6,12)
const PATH=(()=>{
  const pts=[[pcx(1),GY0+TS*0.5]],H2=TS/2;
  const arc=(p0,c,p1)=>{for(let k=1;k<=8;k++){const t=k/8,a=(1-t)*(1-t),b=2*(1-t)*t,d=t*t;pts.push([a*p0[0]+b*c[0]+d*p1[0],a*p0[1]+b*c[1]+d*p1[1]]);}};
  pts.push([pcx(1),pcy(7)-H2]);arc([pcx(1),pcy(7)-H2],[pcx(1),pcy(7)],[pcx(1)+H2,pcy(7)]);
  pts.push([pcx(6)-H2,pcy(7)]);arc([pcx(6)-H2,pcy(7)],[pcx(6),pcy(7)],[pcx(6),pcy(7)+H2]);
  pts.push([pcx(6),pcy(12)]);return pts;})();
const PATH_CELLS=new Map();
(()=>{const T=(i,j,t)=>PATH_CELLS.set(i+','+j,t);
  T(1,0,'cave');for(let j=1;j<=6;j++)T(1,j,'v');T(1,7,'cNE');for(let i=2;i<=5;i++)T(i,7,'h');T(6,7,'cWS');for(let j=8;j<=11;j++)T(6,j,'v');T(6,12,'portal');})();
// Decoração do atlas: árvore, pedras, flores, arbusto, cogumelos e cristais.
const DECOR=[[0,0,0],[7,0,0],[3,0,2],[0,4,3],[7,4,0],[5,4,1],[0,9,0],[7,8,5],[7,12,0],[0,12,4],[3,12,3],[4,10,1],[2,12,4],[0,6,2],[7,2,5]];
const BLOCKED=new Set([...PATH_CELLS.keys(),...DECOR.map(d=>d[0]+','+d[1])]);
const segLen=[];let PLEN=0;
for(let i=0;i<PATH.length-1;i++){const l=Math.hypot(PATH[i+1][0]-PATH[i][0],PATH[i+1][1]-PATH[i][1]);segLen.push(l);PLEN+=l;}
function posAt(d){
  if(d<=0)return{x:PATH[0][0],y:PATH[0][1]+d};
  for(let i=0;i<segLen.length;i++){
    if(d<=segLen[i]){const t=d/segLen[i];return{x:PATH[i][0]+(PATH[i+1][0]-PATH[i][0])*t,y:PATH[i][1]+(PATH[i+1][1]-PATH[i][1])*t};}
    d-=segLen[i];
  }
  const p=PATH[PATH.length-1];return{x:p[0],y:p[1]};
}
function nearestOnPath(x,y){
  let best=1e9,bp=null;
  for(let i=0;i<PATH.length-1;i++){
    const [ax,ay]=PATH[i],[bx,by]=PATH[i+1];
    const dx=bx-ax,dy=by-ay;let t=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));
    const px=ax+dx*t,py=ay+dy*t,d=Math.hypot(x-px,y-py);
    if(d<best){best=d;bp={x:px,y:py};}
  }
  return{dist:best,p:bp};
}

// ---------- Estado ----------
const COLORS=['#ffa24a','#f4d03f','#7ed957','#4db8ff','#b46bff','#ff5fa2','#ff4a4a','#ffffff'];
let cats,jars,worm,parts,texts,state,timer,jarTimer,wave,saved,gameSpeed=1,shake=0,drag=null,now=0,idc=0;
const CAT_R=30;

function reset(){
  cats=[];jars=[];worm=null;parts=[];texts=[];state='between';timer=1.5;jarTimer=9;wave=0;saved=0;lives=3;selected=null;
  choice=null;projs=[];clearMotion();pendingRescues.length=0;drag=null;shake=0;paused=false;document.getElementById('pause').setAttribute('aria-pressed','false');document.querySelector('#pause span').textContent='PAUSAR';addCat(pcx(3),pcy(2),1);addCat(pcx(3),pcy(9),1);
}
function addCat(x,y,lvl){const c={id:++idc,x,y,lvl,ang:Math.random()*6.28,aim:Math.PI/2,cd:0,swing:0,pop:1};cats.push(c);return c;}
function startWave(){
  wave++;
  const et=enemyInfo(wave),armor=Math.floor((wave-1)/4),boss=et.k==='dragon';
  const mult=(1+0.5*armor)*(boss?1.5:1); // armadura e chefe aumentam a vida
  const n=30+wave*4+(boss?12:0),segs=[];
  for(let i=0;i<n;i++){const hp=Math.max(1,Math.round((5+wave*2+(Math.random()<0.25?3:0))*mult));segs.push({hp,max:hp,head:false,flash:0,last:{}});}
  const hh=Math.round((18+wave*14)*mult);segs.unshift({hp:hh,max:hh,head:true,flash:0,last:{}});
  const total=segs.reduce((a,x)=>a+x.hp,0);
  worm={segs,d:-10,speed:Math.min(40,(15+wave*1.2)*(boss?0.85:1)),gap:15,type:et.k,variant:et.variant,name:et.name,armor,boss,total};state='fight';
  texts.push({x:W/2,y:210,s:et.name+(armor?' blindado!':''),life:2.6,big:true});
}
function spawnJar(){
  const hp=8+wave*3+Math.floor(Math.random()*10);
  const lvl=hp>=26?3:hp>=14?2:1; // pote mais forte libera gato de nivel maior
  jars.push({kind:'jar',d:PLEN,hp,lvl,max:hp,flash:0,last:{}});
}
const range=c=>(c.mr||1)*range_(c);
const range_=c=>{let r=62+c.lvl*7;if(c.cls==='mage')r*=1.35;if(c.cls==='knight')r*=0.88;if(c.cls==='archer')r*=1.55;if(c.cls==='bomber')r*=1.2;if(c.cls==='ninja')r*=0.8;if(c.cls==='healer')r*=1.25;if(c.cls==='summoner')r*=1.3;if(c.cls==='angel')r*=1.45;if(c.cls==='wolf')r*=1.25;if(c.cls==='tiger')r*=1.2;return r;};
const melee=c=>Math.min(range(c),56);
const leeks=c=>1+Math.floor(c.lvl/3)+(c.cls==='knight'?1:0)+(c.cls==='ninja'?2:0);
const catDmg=c=>Math.max(1,Math.round(catDmg_(c)*(c.md||1)));
const catDmg_=c=>{let d=c.lvl===1?1:c.lvl*2-1;if(c.cls==='knight')d=Math.round(d*1.7);if(c.cls==='mage')d=Math.round(d*1.1);if(c.cls==='archer')d=Math.max(1,Math.round(d*0.8));if(c.cls==='bomber')d=Math.round(d*2.2);if(c.cls==='ninja')d=Math.round(d*1.2);if(c.cls==='healer')d=Math.max(1,Math.round(d*0.6));if(c.cls==='angel')d=Math.round(d*1.4);if(c.cls==='wolf')d=Math.round(d*1.3);if(c.cls==='tiger')d=Math.round(d*1.2);return d;};
let choice=null,lives=3,selected=null,paused=false;
let projs=[];
const pendingRescues=[];
const SPACING=44; // distancia minima entre gatos
const JAR_SAFE=90; // distancia inicial (px) em que o pote nao pode ser quebrado

// ---------- Logica ----------
// ponto livre (grama, fora da estrada e sem outro gato) mais proximo de (x,y)
// blocos do chao: cada bloco e uma peca da grade
const TILE_W=TS,TILE_H=TS,TILE_X0=GX0,TILE_Y0=GY0;
function cellAt(x,y){const i=Math.floor((x-TILE_X0)/TILE_W),j=Math.floor((y-TILE_Y0)/TILE_H);return{i,j,x:pcx(i),y:pcy(j)};}
function cellOk(cl,ignore){
  if(cl.i<0||cl.i>=GCOLS||cl.j<1||cl.j>=GROWS-1)return false;
  if(BLOCKED.has(cl.i+','+cl.j))return false;
  return !cats.some(o=>o!==ignore&&catOccupies(o,cl));
}
function validSpot(x,y,ignore){return cellOk(cellAt(x,y),ignore);}
function spawnRescuedCat(lvl,origin){
  const destination=randomFreeCell();
  if(!destination)return false;
  const c=addCat(destination.x,destination.y,lvl);c.pop=0;
  hopCat(c,destination,'rescue',origin);return true;
}
function targetPos(t){
  if(t.kind==='jar')return posAt(t.d);
  const i=worm?worm.segs.indexOf(t):-1;
  return i<0?null:posAt(t.pd!==undefined?t.pd:worm.d-i*worm.gap);
}
function glassBurst(x,y,n){
  const cols=['#bfe6ff','#e8f7ff','#7ec0ee','#ffffff'];
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=60+Math.random()*190;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,life:.7+Math.random()*.5,c:cols[i%4],shard:true,rot:Math.random()*6,vr:(Math.random()-.5)*16,size:3+Math.random()*4});}
}
function dmgObj(o,dmg,p,critical=false){
  if(o.hp<=0)return;
  const applied=Math.min(o.hp,dmg);o.hp-=dmg;
  damageMotion(o,applied,p,critical);
  if(o.kind==='jar')glassBurst(p.x,p.y-4,2);
}
function burst(x,y,n,cols=['#8b8378','#c8bfae']){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*100;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.5+Math.random()*0.4,c:cols[i%cols.length]});}}

const RANGED={
  mage:{rate:l=>Math.max(.35,.75-.05*l),speed:300,splash:40,sp:.5,label:'Bola de fogo (área)'},
  archer:{rate:l=>Math.max(.22,.5-.04*l),speed:560,splash:0,sp:0,label:'Flechas (crítico 20%)'},
  bomber:{rate:l=>Math.max(.9,1.6-.06*l),speed:210,splash:62,sp:.6,label:'Bomba (área grande)'},
  healer:{rate:l=>Math.max(.45,.9-.05*l),speed:320,splash:30,sp:.5,label:'Orbe sagrado (cura vidas)'},
  summoner:{rate:l=>Math.max(.5,1.0-.05*l),speed:260,splash:55,sp:.6,label:'Esfera venenosa (área)'},
  angel:{rate:l=>Math.max(.2,.45-.03*l),speed:520,splash:0,sp:0,label:'Raio sagrado'},
  wolf:{rate:l=>Math.max(.3,.65-.04*l),speed:620,splash:60,sp:.7,label:'Raio em cadeia (área)'},
  tiger:{rate:l=>Math.max(.35,.7-.04*l),speed:330,splash:50,sp:.6,label:'Fogo + queimadura (área)'}
};
const PTR={mage:['#ff9a2a','#ffd23a'],healer:['#ffe066','#ffffff'],summoner:['#9bff5a','#3fae20'],angel:['#ffffff','#bfdcff'],wolf:['#ffffff','#7fb4ff'],tiger:['#ff9a2a','#ffe066']};
const PCOL={mage:['255,250,200','255,170,40','255,60,20'],healer:['255,255,230','255,224,102','255,170,40'],summoner:['230,255,200','150,240,80','40,140,30'],angel:['255,255,255','200,230,255','120,160,255'],wolf:['255,255,255','120,190,255','40,90,255'],tiger:['255,240,180','255,140,30','230,50,10']};
let healHits=0;
// armadura do inimigo: reduz dano fisico (espada/flecha), bomba perfura
function armorDmg(t,d,k){
  if(!worm||t.kind==='jar'||!worm.armor)return d;
  if(k==='knight'||k==='archer')return Math.max(1,Math.round(d*(1-0.15*worm.armor)));
  if(k==='bomber')return Math.round(d*(1+0.25*worm.armor));
  return d;
}
function mageUpdate(c,dt){
  const P=RANGED[c.cls];
  c.cd-=dt;c.cast=Math.max(0,(c.cast||0)-dt*5);
  const R=range(c);let tgt=null;
  if(worm)for(const t of worm.segs){if(t.hp<=0)continue;const p=targetPos(t);if(!p||p.y<GY0+14)continue;if(Math.hypot(p.x-c.x,p.y-c.y)<=R){tgt=t;break;}}
  if(!tgt)for(const j of jars){if(j.hp<=0||j.d>PLEN-JAR_SAFE)continue;const p=targetPos(j);if(p&&Math.hypot(p.x-c.x,p.y-c.y)<=R){tgt=j;break;}}
  if(!tgt)return;
  const tp=targetPos(tgt);c.aim=Math.atan2(tp.y-c.y,tp.x-c.x);
  if(c.cd<=0){c.cd=P.rate(c.lvl);c.cast=1;attackMotion(c);
    let dmg=catDmg(c),crit=false;if(c.cls==='archer'&&Math.random()<0.2){dmg*=2;crit=true;}
    projs.push({x:c.x+Math.cos(c.aim)*26,y:c.y+Math.sin(c.aim)*26,t:tgt,k:c.cls,dmg,crit,rot:c.aim,big:c.lvl>=7});}
}
function updateProjs(dt){
  for(const p of projs){
    const P=RANGED[p.k];
    const tp=p.t.hp>0?targetPos(p.t):null;
    if(!tp){p.dead=true;continue;}
    const dx=tp.x-p.x,dy=tp.y-p.y,dd=Math.hypot(dx,dy),sp=P.speed*dt;
    p.rot=Math.atan2(dy,dx);
    if(p.k!=='archer')parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.25,c:(PTR[p.k]||['#8a8f9a','#8a8f9a'])[Math.random()<.5?0:1]});
    if(dd<=sp+8){
      const real=armorDmg(p.t,p.dmg,p.k);
      dmgObj(p.t,real,tp,p.crit);
      if(p.t.hp<=0&&p.t.head)shake=6;
      if(p.k==='tiger')p.t.burn=3;
      if((p.k==='mage'||p.k==='summoner')&&worm&&p.t.kind!=='jar')worm.slow=p.k==='summoner'?1.3:0.8;
      if(p.k==='healer'){healHits++;if(healHits>=30){healHits=0;if(lives<3){lives++;texts.push({x:W/2,y:280,s:'+1 vida!',life:2,big:true});}}}
      if(P.splash){
        const rad=P.splash*(p.big?1.3:1),sp2=Math.max(1,Math.ceil(p.dmg*P.sp)),cand=jars.slice();if(worm)cand.push(...worm.segs);
        for(const t of cand){if(t===p.t||t.hp<=0||(t.kind==='jar'&&t.d>PLEN-JAR_SAFE))continue;const q=targetPos(t);if(q&&Math.hypot(q.x-tp.x,q.y-tp.y)<rad){dmgObj(t,armorDmg(t,sp2,p.k),q);if(p.k==='tiger')t.burn=3;if(p.k==='wolf')parts.push({bolt:true,x:tp.x,y:tp.y,x2:q.x,y2:q.y,life:.2});}}
        burst(tp.x,tp.y,p.k==='bomber'?22:14,p.k==='bomber'?['#444','#ff7a1a','#ffd23a','#888']:(PTR[p.k]||['#ff7a1a','#ffd23a','#ff4a1a']));
        if(p.k==='bomber')shake=Math.max(shake,3);
      }else burst(tp.x,tp.y,5,['#e8d9a8','#fff']);
      p.dead=true;
    }else{p.x+=dx/dd*sp;p.y+=dy/dd*sp;}
  }
  projs=projs.filter(p=>!p.dead);
}
function update(dt){
  if(choice||paused)return;
  if(FX.hitStop>0){FX.hitStop=Math.max(0,FX.hitStop-dt);return;}
  now+=dt;updateMotion(dt);
  {const bl=worm?jars.concat(worm.segs):jars;for(const t of bl){if(t.burn>0&&t.hp>0){t.burn-=dt;t.bt=(t.bt||0)+dt;if(t.bt>=0.5){t.bt=0;const bp=targetPos(t);if(bp){dmgObj(t,1,bp);parts.push({x:bp.x+(Math.random()-.5)*10,y:bp.y-6,vx:(Math.random()-.5)*30,vy:-70,life:.4,c:Math.random()<.5?'#ff9a2a':'#ffd23a'});}}}}}
  if(state==='over')return;
  if(state==='between'){timer-=dt;if(timer<=0)startWave();}
  jarTimer-=dt;if(jarTimer<=0){if(jars.length<2)spawnJar();jarTimer=16;}
  if(worm){worm.d+=worm.speed*(worm.slow>0?0.5:1)*dt;worm.slow=(worm.slow||0)-dt;if(worm.back>0){const st_=Math.min(worm.back,170*dt);worm.d=Math.max(-10,worm.d-st_);worm.back-=st_;}{const cs=420*dt;worm.segs.forEach((sg,i)=>{const tg=worm.d-i*worm.gap;if(sg.pd===undefined)sg.pd=tg;else sg.pd+=Math.max(-cs,Math.min(cs,tg-sg.pd));});}if(worm.d>PLEN+10){lives--;shake=12;texts.push({x:W/2,y:300,s:'Vida perdida!',life:2,big:true});worm=null;state=lives<=0?'over':'between';timer=4;}}
  for(const j of jars){if(j.hp>0)j.d-=22*dt;if(j.flash>0)j.flash-=dt;}
  jars=jars.filter(j=>j.d>-30);
  for(const c of cats){
    c.pop=Math.max(0,c.pop-dt*4);c.atk=Math.max(0,(c.atk||0)-dt);
    if(c.motion||(drag&&drag.cat===c))continue;
    // Arma girando em volta do gato: da dano em tudo que encostar, ate o limite do alcance
    c.ang+=dt*(6+c.lvl*0.4)*(c.cls==='ninja'?1.7:1);
    if(RANGED[c.cls]){mageUpdate(c,dt);continue;}
    const n=leeks(c),R=melee(c);
    const cand=jars.slice();if(worm)cand.push(...worm.segs);
    for(const t of cand){
      if(t.hp<=0||(t.kind==='jar'&&t.d>PLEN-JAR_SAFE))continue; // pote protegido no inicio do trajeto
      const p=targetPos(t);if(!p||p.y<GY0+14)continue;
      const tr=t.kind==='jar'?17:(t.head?25:18);
      if(Math.hypot(p.x-c.x,p.y-c.y)>R+tr+8)continue;
      for(let k=0;k<n;k++){
        const a=c.ang+k*6.2832/n;let hit=false;
        for(let f=0.35;f<=1.001;f+=0.13){if(Math.hypot(c.x+Math.cos(a)*R*f-p.x,c.y+Math.sin(a)*R*f-p.y)<tr+7){hit=true;break;}}
        const key=c.id+'_'+k;
        if(hit&&now-(t.last[key]||-9)>0.3){t.last[key]=now;c.atk=.32;c.aim=Math.atan2(p.y-c.y,p.x-c.x);attackMotion(c);dmgObj(t,c.cls==='knight'?armorDmg(t,catDmg(c),'knight'):catDmg(c),p);if(t.hp<=0&&t.head)shake=6;}
      }
    }
  }
  updateProjs(dt);
  // potes quebrados => gato entra no time
  for(const j of jars){
    if(j.hp<=0){
      const p=posAt(j.d);breakJarMotion(j,p);shake=Math.max(shake,3);
      if(!spawnRescuedCat(j.lvl,p)){
        pendingRescues.push({lvl:j.lvl,origin:p});
        texts.push({x:W/2,y:240,s:'Una gatos para liberar espaço',life:2,big:true});
      }
      saved++;texts.push({x:p.x,y:p.y-30,s:'Gatinho livre!',life:1.2});j.dead=true;
    }
  }
  jars=jars.filter(j=>!j.dead);
  if(pendingRescues.length&&spawnRescuedCat(pendingRescues[0].lvl,pendingRescues[0].origin))pendingRescues.shift();
  if(worm){
    if(worm.segs[0].hp<=0){

function loadImg(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Não foi possível carregar '+src));im.src=src;});}
// Crop only transparent margins; preserve white fur and detached details.
function atlasSprites(im,cols,rows){
  const out=[];
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const sx=Math.round(col*im.naturalWidth/cols),sy=Math.round(row*im.naturalHeight/rows);
    const w=Math.round((col+1)*im.naturalWidth/cols)-sx,h=Math.round((row+1)*im.naturalHeight/rows)-sy;
    const tile=document.createElement('canvas');tile.width=w;tile.height=h;
    const g=tile.getContext('2d',{willReadFrequently:true});g.drawImage(im,sx,sy,w,h,0,0,w,h);
    const data=g.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>100){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
    if(x1<0)throw new Error('Sprite vazio no atlas');
    x0=Math.max(0,x0-2);y0=Math.max(0,y0-2);x1=Math.min(w-1,x1+2);y1=Math.min(h-1,y1+2);
    const c=document.createElement('canvas');c.width=x1-x0+1;c.height=y1-y0+1;
    c.getContext('2d').drawImage(tile,x0,y0,c.width,c.height,0,0,c.width,c.height);
    out.push({c,w:c.width,h:c.height});
  }
  return out;
}

function drawCat(c,x,y,lifted,preview){
  const sp=animationSprite(c,preview),tc=tierCol(c),pose=(!lifted&&!preview)?catPose(c):{x,y,lift:0,t:1};
  if(!lifted&&!preview){x=pose.x;y=pose.y;}

  const land=Math.sin(clamp01((c.landing||0)/.22)*Math.PI),breath=Math.sin(now*3+(c.id||0))*(reducedMotion.matches?0:.015);

    for(let k=0;k<leeks(c);k++){

  const pop=1+(c.pop||0)*.2;
  ctx.scale(pop*(1-breath+land*.1+strike*.07),pop*(1+breath-land*.1-strike*.04));
  if(c.motion&&!reducedMotion.matches)ctx.rotate(Math.sin(pose.t*Math.PI*2)*.075);
  else if(attack&&!reducedMotion.matches)ctx.rotate(strike*.08*Math.cos(c.aim||0));

  ctx.fillStyle=tc;ctx.strokeStyle='#fff8df';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(x-16,labelY-24,7,0,Math.PI*2);ctx.fill();ctx.stroke();

}

    if(rt<.25){crack([[-9,2],[-3,4],[-6,10]]);crack([[2,-12],[8,-8],[6,-3]]);}
    ctx.restore();
    ctx.font='900 17px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.fillStyle=safe?'#9aa':'#fff';
    const t=safe?'🔒':j.hp;ctx.strokeText(t,p.x,p.y-h*.55-3);ctx.fillText(t,p.x,p.y-h*.55-3);
    return;
  }
}
// ---------- Inimigos (varios tipos + armaduras) ----------
const ENEMY_TYPES=[{k:'worm',name:'Minhoca de Pedra'},{k:'snake',name:'Cobra Venenosa'},{k:'centipede',name:'Lacraia Gigante'},{k:'dragon',name:'Dragão de Fogo'}];
const DRAGON_VARIANTS=[{k:'fire',name:'Dragão de Fogo'},{k:'ice',name:'Dragão de Gelo'},{k:'toxic',name:'Dragão Venenoso'},{k:'shadow',name:'Dragão Sombrio'}];
function enemyInfo(w){const et=ENEMY_TYPES[(w-1)%4];if(et.k==='worm'&&Math.floor((w-1)/4)%4===2)return{k:'worm',name:'Verme de Gelo',variant:'ice'};if(et.k==='worm'&&Math.floor((w-1)/4)%4===3)return{k:'worm',name:'Verme de Lava',variant:'lava'};if(et.k!=='dragon')return{k:et.k,name:et.name};const v=DRAGON_VARIANTS[(Math.floor(w/4)-1)%4];return{k:'dragon',name:v.name,variant:v.k};}
const ARMOR_COL=['','#9fb0c4','#d6e0ee','#f2c94c'];

const TIER_NAME=['Filhote','Aprendiz','Guerreiro','Veterano'];
const WEAPON_NAME={flame:'Fogo e queimadura',bite:'Raio em cadeia',dagger:'Adaga',holystaff:'Cajado Sagrado',bow:'Arco Longo',cannon:'Canhão de Mão',leek:'Clava de Folha',club:'Clava',axe:'Machado',mace:'Maça',sword:'Espada',greatsword:'Espadão Dourado',orb:'Cajado de Orbe',crystal:'Cajado de Cristal'};
function weaponStyle(c){
  if(c.cls==='knight')return c.lvl>=7?'greatsword':'sword';
  if(c.cls==='mage')return c.lvl>=7?'crystal':'orb';
  if(c.cls==='archer')return 'bow';
  if(c.cls==='bomber')return 'cannon';
  if(c.cls==='ninja')return 'dagger';if(c.cls==='healer')return 'holystaff';if(c.cls==='summoner')return 'orb';if(c.cls==='angel')return 'greatsword';if(c.cls==='wolf')return 'bite';if(c.cls==='tiger')return 'flame';
  return['leek','club','axe','mace'][Math.min(c.lvl,4)-1];
}
function catName(c){return c.cls?CLASS_DEFS[c.cls].title:TIER_NAME[Math.min(c.lvl,4)-1];}

function angAt(d){const a=posAt(d-4),b=posAt(d+4);return Math.atan2(b.y-a.y,b.x-a.x);}
function drawSeg(type,sg,r,i,ang,armor){
  const index={worm:0,snake:1,centipede:2,dragon:3}[type];
  const sp=ART.enemies[index+(sg.head?0:4)];
  const h=r*(sg.head?2.15:1.65),w=h*sp.w/sp.h;
  const variants={ice:'hue-rotate(155deg) saturate(.7) brightness(1.3)',lava:'hue-rotate(80deg) saturate(1.8)',toxic:'hue-rotate(100deg)',shadow:'hue-rotate(260deg) brightness(.7)'};
  ctx.save();
  const pulse=Math.sin(now*(type==='centipede'?13:7)-i*.7);
  ctx.rotate(ang-Math.PI/2+pulse*(type==='snake'?.09:.025));
  ctx.translate(pulse*(type==='snake'?2:1),(sg.recoil||0)*(sg.hurt||0)/.2);
  ctx.scale(1+pulse*.035+(sg.hurt||0)*.3,1-pulse*.025-(sg.hurt||0)*.2);
  const filters=[];
  if(worm.variant&&variants[worm.variant])filters.push(variants[worm.variant]);
  if(armor>0)filters.push('drop-shadow(0 0 1px '+ARMOR_COL[Math.min(armor,3)]+')');
  if(sg.flash>0)filters.push('brightness(1.8)');
  ctx.filter=filters.join(' ')||'none';
  paintSprite(ctx,sp,0,0,w,h);ctx.restore();
}
function drawWorm(){
  if(!worm)return;
  const type=worm.type,boss=worm.boss;
  for(let i=worm.segs.length-1;i>=0;i--){
    const sg=worm.segs[i],d=sg.pd!==undefined?sg.pd:worm.d-i*worm.gap,p=posAt(d);
    if(p.y<GY0+TS*0.3)continue;
    const r=sg.head?(boss?30:26):(type==='snake'?18:boss?21:20);
    ctx.save();ctx.translate(p.x,p.y);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(3,r*.75,r,r*.45,0,0,6.28);ctx.fill();
    drawSeg(type,sg,r,i,angAt(d),worm.armor);
    ctx.restore();
    if(sg.head){
      const y=Math.max(85,p.y-r-22);
      hudPanel(1,p.x-20,y,40,18);hudText(sg.hp,p.x,y+12,10,'#56351d','center');
    }

  }
}

// ---------- HUD ----------
function bar(x,y,w,h,f,c0,c1){
  ctx.fillStyle='rgba(0,0,0,.55)';rr(ctx,x,y,w,h,h/2);ctx.fill();
  f=Math.max(0,Math.min(1,f));if(f>0){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;rr(ctx,x+1,y+1,Math.max(h-2,(w-2)*f),h-2,(h-2)/2);ctx.fill();}
}
function shadowText(t,x,y,font,fill,align='left'){ctx.font=font;ctx.textAlign=align;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y);}
function hudPanel(index,x,y,w,h){paintSprite(ctx,ART.hud[index],x+w/2,y+h/2,w,h);}
function hudText(text,x,y,size=10,color='#fff0bf',align='left'){
  ctx.font='800 '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(text,x,y);
}
function drawHUD(){
  ctx.save();
  hudPanel(0,76,2,208,49);
  hudText('GUARDIÕES DO BOSQUE',180,18,9,'#ebd08a','center');
  hudText('ONDA '+(worm?wave:wave+1),180,35,16,'#fff3ce','center');
  const hp=worm?worm.segs.reduce((sum,sg)=>sum+Math.max(0,sg.hp),0):0;
  bar(119,41,122,4,worm?hp/worm.total:1-timer/4,worm?'#ffb567':'#c9e879',worm?'#dc5e38':'#69a43b');
  hudPanel(0,3,5,75,40);
  hudText('VIDAS',40,18,8,'#ebd08a','center');
  for(let i=0;i<3;i++){
    ctx.save();if(i>=lives)ctx.filter='grayscale(1) brightness(.45)';
    paintSprite(ctx,ART.hud[2],21+i*19,30,16,15);ctx.restore();
  }
  hudPanel(0,283,5,74,40);
  paintSprite(ctx,ART.hud[3],297,25,23,25);hudText(cats.length,313,24,11);
  paintSprite(ctx,ART.hud[4],320,34,12,16);hudText(saved,332,37,10);
  hudPanel(1,103,51,154,24);
  hudText(worm?worm.name:'Próxima: '+enemyInfo(wave+1).name,180,66,9,'#523319','center');
  if(worm&&worm.armor>0)hudText('ARMADURA '+Math.min(worm.armor,3),180,79,7,'#fff3ce','center');
  if(jars.length<2){
    hudPanel(0,4,H-42,143,38);paintSprite(ctx,ART.hud[4],20,H-21,20,25);
    hudText('NOVO RESGATE',38,H-24,8,'#efd79e');
    bar(38,H-19,80,5,1-jarTimer/16,'#e5f6b0','#80bc59');
  }
  if(selected&&cats.includes(selected)){
    const c=selected,y=H-108;
    ctx.strokeStyle='#ffe5a0';ctx.lineWidth=1.6;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(c.x,c.y,26,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    hudPanel(0,4,y,W-8,68);
    paintSprite(ctx,ART.hud[7],37,y+34,38,42);
    const sp=spriteFor(c);paintSprite(ctx,sp,37,y+32,31,36);
    hudText(catName(c).toUpperCase(),65,y+23,12);
    hudText('NÍVEL '+c.lvl+'   /   '+(c.mut||'GUARDIÃO'),65,y+37,8,'#e7c47c');
    hudText('DANO '+catDmg(c)+'    ALCANCE '+Math.round(RANGED[c.cls]?range(c):melee(c)),65,y+50,8,'#c5e58e');
  }
  if(paused){
    ctx.fillStyle='rgba(12,27,16,.76)';ctx.fillRect(0,0,W,H);
    hudPanel(0,48,241,264,136);paintSprite(ctx,ART.hud[7],180,263,47,53);
    hudText('BOSQUE EM PAUSA',180,314,19,'#fff0bf','center');
    hudText('Respire. Os guardiões esperam por você.',180,336,9,'#e4c995','center');
    hudText('Toque em CONTINUAR para voltar',180,354,9,'#c5e58e','center');
  }
  ctx.restore();
}


function draw(){
  ctx.save();
  if(shake>0&&!paused&&!choice&&!reducedMotion.matches)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG();drawEffects(true);
  jars.forEach(drawJar);
  drawWorm();
  drawEntrance();
  for(const c of cats)if(!(drag&&drag.cat===c))drawCat(c,c.x,c.y,false);
  if(drag){
    const cl=cellAt(drag.x,drag.y);
    for(let i=0;i<=7;i++)for(let j=0;j<=12;j++){const q={i,j,x:TILE_X0+TILE_W*(i+.5),y:TILE_Y0+TILE_H*(j+.5)};if(!cellOk(q,drag.cat))continue;
      ctx.fillStyle='rgba(255,255,255,.14)';rr(ctx,q.x-TILE_W/2+2,q.y-TILE_H/2+2,TILE_W-4,TILE_H-4,6);ctx.fill();}
    const c=drag.cat,o=cats.find(k=>k!==c&&Math.abs(k.x-cl.x)<6&&Math.abs(k.y-cl.y)<6);
    if(o){ctx.strokeStyle=o.lvl===c.lvl?'#6dff6d':'#ff6d6d';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(o.x,o.y,26,0,6.28);ctx.stroke();ctx.setLineDash([]);}
    const ok=!!o?(o.lvl===c.lvl&&(o.cls||null)===(c.cls||null)):cellOk(cl,c);
    ctx.fillStyle=ok?'rgba(255,255,255,.2)':'rgba(255,60,60,.25)';ctx.strokeStyle=ok?'#fff':'#ff5a5a';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cl.x,cl.y,RANGED[c.cls]?range(c):melee(c),0,6.28);ctx.fill();ctx.stroke();
    ctx.strokeStyle=ok?'#6dff6d':'#ff5a5a';ctx.lineWidth=3;rr(ctx,cl.x-TILE_W/2+2,cl.y-TILE_H/2+2,TILE_W-4,TILE_H-4,7);ctx.stroke();
    drawCat(c,drag.x,drag.y,true);
  }
  for(const p of projs){
    const sp=p.k==='archer'?ART.props[10]:p.k==='bomber'?ART.props[11]:ART.weapons[{mage:4,tiger:4,healer:5,angel:5,summoner:6,wolf:7}[p.k]??4];
    const w=p.k==='archer'?26:p.k==='bomber'?20:p.big?32:24,h=w*sp.h/sp.w;
    ctx.save();ctx.translate(p.x,p.y);if(p.k==='archer'||p.k==='mage'||p.k==='tiger'||p.k==='wolf')ctx.rotate(p.rot||0);
    paintSprite(ctx,sp,0,0,w,h);ctx.restore();
  }
  drawEffects(false);
  parts.forEach(p=>{
    if(p.bolt){ctx.globalAlpha=Math.min(1,p.life*6);ctx.lineCap='round';ctx.lineJoin='round';
      const dx=p.x2-p.x,dy=p.y2-p.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,pts=[[p.x,p.y]];
      for(let k=1;k<4;k++){const o=(((k*37+Math.floor(p.life*40))%7)-3)*3;pts.push([p.x+dx*k/4+nx*o,p.y+dy*k/4+ny*o]);}pts.push([p.x2,p.y2]);
      ctx.strokeStyle='#4a90ff';ctx.lineWidth=5;ctx.beginPath();pts.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.8;ctx.stroke();return;}
    if(p.ring){ctx.globalAlpha=Math.max(0,p.life*2.2);ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.stroke();return;}
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.fillStyle=p.c;
    if(p.shard){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.8,p.size*.7);ctx.lineTo(-p.size*.7,p.size*.5);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(40,90,140,.7)';ctx.lineWidth=1;ctx.stroke();ctx.restore();}
    else{ctx.beginPath();ctx.ellipse(p.x,p.y,2.5,1.5,now*3,0,Math.PI*2);ctx.fill();}
  });ctx.globalAlpha=1;
  texts.forEach(t=>{
    ctx.globalAlpha=Math.min(1,t.life*2);
    if(t.big){
      hudPanel(1,24,t.y-24,W-48,36);
      const size=Math.min(14,Math.max(9,260/(t.s.length*.6)));
      hudText(t.s,W/2,t.y-1,size,'#56351d','center');
    }else shadowText(t.s,t.x,t.y,'bold 12px system-ui','#ffe8aa','center');
  });ctx.globalAlpha=1;
  drawHUD();
  if(state==='over'){
    ctx.fillStyle='rgba(12,27,16,.8)';ctx.fillRect(0,0,W,H);
    hudPanel(0,32,228,296,166);paintSprite(ctx,ART.hud[3],180,253,57,60);
    hudText('O BOSQUE DESCANSA',180,308,19,'#fff0bf','center');
    hudText('Você protegeu até a onda '+wave,180,334,12,'#e7ce99','center');
    hudText(saved+' gatinhos resgatados',180,355,11,'#c5e58e','center');
    hudText('Toque para uma nova aventura',180,378,10,'#fff0bf','center');
  }
  ctx.restore();
}

let last=performance.now();
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;ctx.setTransform(2,0,0,2,0,0);
  for(let i=0;i<gameSpeed;i++)update(dt);
  draw();if(choice)drawChoice();requestAnimationFrame(loop);
}
loadGameArt().then(()=>{
  document.getElementById('loading').remove();reset();requestAnimationFrame(loop);
}).catch(error=>{
  const status=document.getElementById('loading');status.textContent='Falha ao carregar a arte. Recarregue a página para tentar novamente.';
  status.setAttribute('role','alert');console.error(error);
});
</script>
